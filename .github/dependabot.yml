# Aggiornamenti controllati delle librerie: Dependabot apre una pull request per libreria con la nuova
# versione in constraints.txt; la CI (workflow Build) esegue i test e l'autotest dell'eseguibile.
# Una PR alla volta: se un aggiornamento è incompatibile fallisce solo quello, non tutti gli altri.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # streamlit-desktop-app (finestra dell'app) funziona solo con pywebview 5.x
      - dependency-name: pywebview
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
